spring.cache.type: none
spring:
  init:
    mode: always
  datasource:
    url: jdbc:postgresql://localhost:5433/jira?options=-c%20timezone=Europe/Kyiv
    username: jira
    password: jira-test
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog.sql
  mail:
    host: localhost
    port: 2525
    username: test
    password: test

  # --- ДОДАЙТЕ ЦЕЙ БЛОК ДЛЯ ЗАГЛУШКИ OAUTH2 ---
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
# --------------------------------------------

app:
  templates-update-cache: 0s
  host-url: http://localhost:8080
  mail-sending-props:
    core-pool-size: 1
    max-pool-size: 5
    queue-capacity: 10