MAIL_USER: test
MAIL_PASSWORD: test

spring:
  datasource:
    url: jdbc:h2:mem:jira_${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    driver-class-name: org.h2.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        hbm2ddl.auto: none

  liquibase:
    enabled: true
    change-log: classpath:db/changelog-test.sql

  sql:
    init:
      mode: never
      # mode: always
      # schema-locations: classpath:schema.sql
      # data-locations: classpath:db/data-test.sql

  test:
    database:
      replace: NONE

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  mail:
    host: localhost
    port: 2525
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
    test-connection: false

  security:
    oauth2:
      client:
        registration: {}
        provider: {}

logging:
  level:
    org.springframework.jdbc.datasource.init: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
