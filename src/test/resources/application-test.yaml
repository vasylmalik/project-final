spring:
  liquibase:
    enabled: true
    change-log: classpath:db/changelog.sql
  cache:
    type: none
  datasource:
    url: jdbc:h2:mem:jira-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never

