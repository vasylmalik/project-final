spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: "classpath:db/changelog-test.sql"
  cache:
    type: none
  mail:
    username: test@example.com
    password: testpassword
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-github-client-id
            client-secret: test-github-client-secret
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
          gitlab:
            client-id: test-gitlab-client-id
            client-secret: test-gitlab-client-secret