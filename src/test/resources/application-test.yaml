spring.cache.type: none
spring:
  init:
    mode: always
  datasource:
    url: jdbc:h2:mem:jira-test;MODE=PostgreSQL;NON_KEYWORDS=VALUE,COMMENT
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  sql:
    init:
      mode: never

  liquibase:
    enabled: false