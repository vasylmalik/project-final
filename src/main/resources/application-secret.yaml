app:
  test-mail: ${TEST_MAIL:test@gmail.com}

spring:
  datasource:
    username: ${DB_USERNAME:test-user}
    password: ${DB_PASSWORD:test-password}

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_ID:test-github-id}
            client-secret: ${GITHUB_SECRET:test-github-secret}
          google:
            client-id: ${GOOGLE_ID:test-google-id}
            client-secret: ${GOOGLE_SECRET:test-google-secret}
          gitlab:
            client-id: ${GITLAB_ID:test-gitlab-id}
            client-secret: ${GITLAB_SECRET:test-gitlab-secret}

  mail:
    host: ${MAIL_HOST:://gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:test@gmail.com}
    password: ${MAIL_PASSWORD:test-password}

