version: '3.9'

services:
  jira-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: JiraRush
      POSTGRES_DB: jira
    ports:
      - "5434:5432"
    volumes:
      - jira-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jira -d jira" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: jira-app
    restart: always
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://jira-db:5432/jira
#    ports:
#      - "8080:8081"
    volumes:
      - app-logs:/app/logs
      - app-attachments:/app/attachments
#      - app-resources:/app/resources
    depends_on:
      jira-db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: jira-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
#      - app-resources:/opt/jirarush/resources:ro
    depends_on:
      - app

volumes:
  jira-db-data:
  app-logs:
  app-attachments:
#  app-resources: