<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{email.registration.title}">JiraRush - Confirm Your Email</title>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type"/>
</head>
<body>
<p th:text="#{email.greeting}, ${user.firstName}!"/>
<p th:text="#{email.registration.message}">Please confirm your email address to complete your registration and start using JiraRush.
</p>
<a th:href="${confirmationUrl}" th:text="#{email.registration.confirm}">Confirm Email</a>
</body>
</html>
