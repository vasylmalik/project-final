<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{mail.confirm.title}">JiraRush - подтверждение почты</title>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type"/>
</head>
<body>
<!-- Передаем имя пользователя в плейсхолдер {0} -->
<p th:text="#{mail.confirm.hello(${user.firstName})}">Привет, Пользователь.</p>
<p th:text="#{mail.confirm.text}">Текст подтверждения почты...</p>
<a th:href="${confirmationUrl}" th:text="#{mail.confirm.button}">Подтвердить почту</a>
</body>
</html>
