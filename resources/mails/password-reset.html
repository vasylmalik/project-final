<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <title th:text="#{mail.reset.title}">JiraRush - установить новый пароль</title>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type"/>
</head>
<body>
<p th:text="#{mail.reset.hello(${user.firstName})}">Привет, Пользователь.</p>
<p th:text="#{mail.reset.text(${user.email})}">Мы получили запрос на установку нового пароля...</p>
<a th:href="${resetUrl}" th:text="#{mail.reset.button}">Установить пароль</a>
</body>
</html>
