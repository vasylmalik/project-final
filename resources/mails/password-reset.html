<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <title th:text="#{email.reset.title}">JiraRush - reset password</title>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type"/>
</head>
<body>
<p th:text="#{email.greeting}' + ${user.firstName} + '.'"/>
<p th:text="#{email.reset.message} + ${user.email} + '.'"/>
<a th:href="${resetUrl}" th:text="#{email.reset.button}">Reset Password</a>
</body>
</html>
