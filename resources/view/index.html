<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<!--&lt;!&ndash;/*@thymesVar id="authUser" type="com.javarush.jira.login.AuthUser"*/&ndash;&gt;-->

<th:block th:replace="~{layout/main::page(title=#{index.page.title},appMain=~{::appMain})}">
    <appMain>
        <h1 th:text="#{index.header}">JiraRush Home page</h1>
        <div th:if="${authUser} != null">
            <form action="/ui/logout" method="post">
                <button class="btn btn-primary btn-lg mt-3" type="submit" th:text="#{index.logout}">Logout</button>
            </form>
        </div>
        <div class="language-selector mt-4 text-center">
            <span th:text="#{app.language}">Language:</span>
            <a th:href="@{/(lang=en)}" class="lang-link" th:classappend="${#locale.language == 'en'} ? 'active' : ''">English</a>
            <a th:href="@{/(lang=ru)}" class="lang-link" th:classappend="${#locale.language == 'ru'} ? 'active' : ''">Русский</a>
        </div>
    </appMain>
</th:block>
