<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<!--/*@thymesVar id="authUser" type="com.javarush.jira.login.AuthUser"*/-->

<th:block th:replace="~{layout/main::page(title=#{home.page.title},appMain=~{::appMain})}">
    <appMain>
        <h1 th:text="#{home.page.header}">JiraRush Home page</h1>
        <div th:if="${authUser} != null">
            <form action="/ui/logout" method="post">
                <button class="btn btn-primary btn-lg mt-3" type="submit"
                        th:text="#{home.page.logout}">Logout</button>
            </form>
        </div>
    </appMain>
</th:block>
</html>
