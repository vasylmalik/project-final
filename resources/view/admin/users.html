<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<th:block th:replace="~{layout/main::page(title=#{users.title}, appMain=~{::appMain}, activeMenuItem='users')}">
    <appMain>
        <div class="jumbotron pt-4">
            <div class="container">
                <h3 class="text-center" th:text="#{users.title}">Users</h3>

                <button class="btn btn-primary" th:onclick="add()" th:text="#{users.add}">
                    Add
                </button>

                <table class="table table-striped" id="datatable">
                    <thead>
                    <tr>
                        <th th:text="#{users.firstName}">First name</th>
                        <th th:text="#{users.lastName}">Last name</th>
                        <th th:text="#{users.displayName}">Display name</th>
                        <th th:text="#{users.email}">Email</th>
                        <th th:text="#{users.roles}">Roles</th>
                        <th th:text="#{users.registered}">Registered</th>
                        <th th:text="#{users.active}">Active</th>
                        <th></th>
                        <th></th>
                    </tr>
                    </thead>
                </table>
            </div>
        </div>

        <div class="modal fade" id="editRow" tabindex="-1" aria-hidden="true" aria-labelledby="modalTitle">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title" id="modalTitle" th:text="#{users.modal.title}">Edit user</h4>
                        <button class="close" type="button" data-bs-dismiss="modal" onclick="closeNoty()" aria-label="Close">
                            &times;
                        </button>
                    </div>

                    <div class="modal-body">
                        <form id="detailsForm">
                            <input id="id" name="id" type="hidden">

                            <div class="form-group">
                                <label class="col-form-label" for="firstName" th:text="#{users.firstName}">First name</label>
                                <input class="form-control" id="firstName" name="firstName" type="text"
                                       th:placeholder="#{users.firstName.placeholder}" placeholder="First name">
                            </div>

                            <div class="form-group">
                                <label class="col-form-label" for="lastName" th:text="#{users.lastName}">Last name</label>
                                <input class="form-control" id="lastName" name="lastName" type="text"
                                       th:placeholder="#{users.lastName.placeholder}" placeholder="Last name">
                            </div>

                            <div class="form-group">
                                <label class="col-form-label" for="displayName" th:text="#{users.displayName}">Display name</label>
                                <input class="form-control" id="displayName" name="displayName" type="text"
                                       th:placeholder="#{users.displayName.placeholder}" placeholder="Display name">
                            </div>

                            <div class="form-group">
                                <label class="col-form-label" for="email" th:text="#{users.email}">Email</label>
                                <input class="form-control" id="email" name="email" type="email"
                                       th:placeholder="#{users.email.placeholder}" placeholder="Email">
                            </div>

                            <div class="form-group">
                                <label class="col-form-label" for="password" th:text="#{users.password}">Password</label>
                                <input class="form-control" id="password" name="password" type="password"
                                       th:placeholder="#{users.password.placeholder}" placeholder="Password">
                            </div>
                        </form>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" type="button" data-bs-dismiss="modal" onclick="closeNoty()">
                            <span class="fa fa-close"></span>
                            <span th:text="#{common.cancel}">Cancel</span>
                        </button>
                        <button class="btn btn-primary" type="button" onclick="save()">
                            <span class="fa fa-check"></span>
                            <span th:text="#{common.save}">Save</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </appMain>
</th:block>
<script src="/static/js/common.js"></script>
<script src="/static/js/users.js"></script>
