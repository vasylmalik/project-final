<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{layout/main::page(title=#{password.reset.title},appMain=~{::appMain})}">
    <appMain>
        <section>
            <div class="container pt-5">
                <div class="row d-flex justify-content-center align-items-center mt-0 mt-md-5">
                    <div class="col-12 col-md-8 col-xl-5">
                        <div class="card shadow-2-strong" style="border-radius: 1rem;">
                            <div class="card-body p-3 p-md-5 text-center">
                                <form action="/ui/password/save" method="post">
                                    <p th:text="#{password.reset.choose}">Choose a new password</p>
                                    <div class="form-outline mb-4">
                                        <input class="form-control" name="password" required type="password"
                                               th:placeholder="#{password.reset.placeholder}"
                                               placeholder="Enter new password"/>
                                    </div>

                                    <input class="form-control" hidden name="token" required th:value="${token}" type="text"/>

                                    <div class="row">
                                        <div class="col-5 col-md-6 d-grid gap-2">
                                            <button class="btn btn-success btn-lg" type="submit"
                                                    th:text="#{common.continue}">Continue</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </appMain>
</th:block>
