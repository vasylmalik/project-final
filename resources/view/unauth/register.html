<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{layout/main::page(title=#{register.title},appMain=~{::appMain})}">
    <appMain>
        <div class="row d-flex justify-content-center align-items-center">
            <div class="col-12 col-md-8 col-xl-5">
                <div class="card shadow-2-strong" style="border-radius: 1rem;">
                    <div class="card-body p-3 p-md-5 text-center">
                        <h3 class="mb-3" th:text="#{register.title}">Реєстрація</h3>
                        <form action="/ui/register" method="post" th:object="${userTo}">
                            <div class="form-outline mb-4">
                                <input required type="text"
                                       th:placeholder="#{register.firstName}"
                                       th:class="${#fields.hasErrors('firstName')} ? 'form-control is-invalid' : 'form-control'"
                                       th:field="*{firstName}"/>
                                <span class="help-block" th:if="${#fields.hasErrors('firstName')}">
									<ul>
										<li class="text-danger text-start"
                                            th:each="err : ${#fields.errors('firstName')}" th:text="${err}"/>
									</ul>
								</span>
                            </div>
                            <div class="form-outline mb-4">
                                <input type="text"
                                       th:placeholder="#{register.lastName}"
                                       th:class="${#fields.hasErrors('lastName')} ? 'form-control is-invalid' : 'form-control'"
                                       th:field="*{lastName}"/>
                                <span class="help-block" th:if="${#fields.hasErrors('lastName')}">
									<ul>
										<li class="text-danger text-start" th:each="err : ${#fields.errors('lastName')}"
                                            th:text="${err}"/>
									</ul>
								</span>
                            </div>
                            <div class="form-outline mb-4">
                                <input required type="text"
                                       th:placeholder="#{register.email}"
                                       th:class="${#fields.hasErrors('email')} ? 'form-control is-invalid' : 'form-control'"
                                       th:field="*{email}"/>
                                <span class="help-block" th:if="${#fields.hasErrors('email')}">
									<ul>
										<li class="text-danger text-start" th:each="err : ${#fields.errors('email')}"
                                            th:text="${err}"/>
									</ul>
								</span>
                            </div>
                            <div class="form-outline mb-4">
                                <input required type="password"
                                       th:placeholder="#{register.password}"
                                       th:class="${#fields.hasErrors('password')} ? 'form-control is-invalid' : 'form-control'"
                                       th:field="*{password}"/>
                                <span class="help-block" th:if="${#fields.hasErrors('password')}">
									<ul>
										<li class="text-danger text-start" th:each="err : ${#fields.errors('password')}"
                                            th:text="${err}"/>
									</ul>
								</span>
                            </div>
                            <div class="row">
                                <div class="d-grid gap-2">
                                    <button class="btn btn-success btn-lg" type="submit"
                                            th:text="#{register.button}">Створити обліковий запис</button>
                                </div>
                            </div>
                        </form>
                        <div class="row mt-4">
                            <div class="col-5">
                                <hr>
                            </div>
                            <div class="col-2" th:text="#{register.or}">АБО</div>
                            <div class="col-5">
                                <hr>
                            </div>
                        </div>
                        <p class="mt-3 mb-4" th:text="#{register.social}">
                            Швидка реєстрація через соціальні мережі
                        </p>
                        <a class="btn btn-secondary btn-lg me-2" href="/oauth2/authorization/google" type="button">
                            <i class="fa-brands fa-google"></i>
                        </a>
                        <a class="btn btn-dark btn-lg me-2" href="/oauth2/authorization/github" type="button">
                            <i class="fa-brands fa-github"></i>
                        </a>
                        <a class="btn btn-warning btn-lg" href="/oauth2/authorization/gitlab" type="button">
                            <i class="fa-brands fa-gitlab"></i>
                        </a>
                        <p class="mt-3 mb-2 mb-md-0" style="font-size:0.8em">
                            <span th:text="#{register.haveAccount}">Вже маєте обліковий запис?</span>
                            <a href="/view/login" th:text="#{register.signin}">Увійти</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </appMain>
</th:block>
